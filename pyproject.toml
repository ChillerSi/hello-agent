[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-agent-learning"
version = "0.1.0"
description = "Python agent learning examples"
requires-python = ">=3.10"
dependencies = ["openai", "python-dotenv", "requests", "tavily-python"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["hello_agent*"]
namespaces = true
